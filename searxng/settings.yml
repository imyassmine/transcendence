use_default_settings: true

general:
  instance_name: "transcendence-search"

server:
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  default_lang: "fr"
  formats:
    - html
    - json
  ban_time_on_fail: 5
  max_ban_time_on_fail: 60
  suspended_times:
    SearxEngineAccessDenied: 600
    SearxEngineCaptcha: 600
    SearxEngineTooManyRequests: 300
    cf_SearxEngineCaptcha: 600
    cf_SearxEngineAccessDenied: 600
    recaptcha_SearxEngineCaptcha: 600

outgoing:
  request_timeout: 6.0

engines:
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: startpage
    disabled: false
